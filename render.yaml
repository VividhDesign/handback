services:
  - type: web
    name: handback
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATA_DIR
        value: data
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
