# Keeps the free Render instance awake (PLAN B: keep-alive on the free plan).
# It only requests /healthz; it makes no commits and needs no secrets.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 90 --retry 2 https://handback-nvq9.onrender.com/healthz
